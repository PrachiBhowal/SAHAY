<!--
  Gamosa-inspired border motif — ORIGINAL geometric design.

  Not copied or traced from any reference image found during Prachi's
  research (per NER_Visual_Assets_Handoff.docx "Before Using These In
  Production" — scraped research images must never ship in the app).

  Interpretation only: a thin repeating diamond-and-line border in the
  spirit of a woven textile edge pattern, using our existing palette
  (terracotta on cream) rather than traditional red-on-white, so it
  reads as "inspired by" rather than a reproduction of any specific
  textile or artist's work.

  Usage: tiles horizontally. Drop into an <img> or inline <svg>, or use
  as a CSS background-image via GamosaBorder.jsx / .css in this folder.
  Intrinsic tile size: 48 x 20 (viewBox below) — repeats along x.
-->
<svg width="100%" height="20" viewBox="0 0 48 20" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
  <defs>
    <pattern id="gamosaBorderUnit" x="0" y="0" width="48" height="20" patternUnits="userSpaceOnUse">
      <!-- base line, top and bottom -->
      <rect x="0" y="2" width="48" height="1.5" fill="#6B4F3B" opacity="0.35" />
      <rect x="0" y="16.5" width="48" height="1.5" fill="#6B4F3B" opacity="0.35" />

      <!-- repeating diamond motif, alternating small/large -->
      <g fill="#C77B4F">
        <path d="M8 4 L11 10 L8 16 L5 10 Z" />
        <path d="M24 6 L27 10 L24 14 L21 10 Z" opacity="0.7" />
        <path d="M40 4 L43 10 L40 16 L37 10 Z" />
      </g>

      <!-- small ochre connecting ticks -->
      <g fill="#D9A441">
        <circle cx="16" cy="10" r="1.4" />
        <circle cx="32" cy="10" r="1.4" />
      </g>
    </pattern>
  </defs>
  <rect x="0" y="0" width="100%" height="20" fill="url(#gamosaBorderUnit)" />
</svg>
